shamefullyHoist: true

# `playwright-chromium` is needed for `slidev export` (PDF/PNG/PPTX) and has a
# postinstall script that downloads the browser. pnpm v11 errors on unapproved
# build scripts by default (`strictDepBuilds: true`), so allowlist it up-front.
allowBuilds:
  playwright-chromium: true

# `@comark/markdown-it` (used by @slidev/cli) requires markdown-it ^14 and
# imports `markdown-it/lib/token.mjs`, which markdown-it 15 no longer exports.
# Without a pin, autoInstallPeers resolves the peer to markdown-it 15. The
# direct `markdown-it` dependency in package.json is what makes pnpm resolve
# those peers to v14; this override keeps every other consumer on v14 too.
overrides:
  markdown-it: ^14.1.0
