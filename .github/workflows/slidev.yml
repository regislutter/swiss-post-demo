name: slidev

on:
  push:
    branches: [main]
    paths:
      - slidev/**
      - .github/workflows/slidev.yml
  pull_request:
    paths:
      - slidev/**
      - .github/workflows/slidev.yml
  workflow_dispatch:

permissions:
  contents: read

# Pages deployments must not be cancelled half-way; only superseded PR builds are.
concurrency:
  group: slidev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: slidev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: slidev/pnpm-lock.yaml

      # `playwright-chromium` is only needed for `slidev export`; skip its browser download.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Project Pages are served from /<repo>/, so assets need that base path.
      # The build also emits a 404.html copy of index.html, so deep links to a slide keep working.
      - name: Build Slidev
        run: pnpm exec slidev build --base "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: slidev/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
